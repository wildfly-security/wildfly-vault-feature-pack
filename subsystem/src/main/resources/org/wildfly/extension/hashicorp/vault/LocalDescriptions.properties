# HashiCorp Vault subsystem descriptions
hashicorp-vault=HashiCorp Vault subsystem for credential store integration
hashicorp-vault.add=Add the HashiCorp Vault subsystem
hashicorp-vault.remove=Remove the HashiCorp Vault subsystem

# Credential store resource descriptions
hashicorp-vault.credential-store=A HashiCorp Vault credential store
hashicorp-vault.credential-store.add=Add a HashiCorp Vault credential store
hashicorp-vault.credential-store.remove=Remove a HashiCorp Vault credential store

# Credential store attributes
hashicorp-vault.credential-store.host-address=The HashiCorp Vault server URL (e.g., http://localhost:8200)
hashicorp-vault.credential-store.namespace=The HashiCorp Vault namespace (Enterprise feature, optional)
hashicorp-vault.credential-store.credential-reference=A reference to a credential store or clear text credential for the HashiCorp Vault authentication token
hashicorp-vault.credential-store.client-ssl-context=A reference to the client-ssl-context used to secure HTTPS connections to the vault

# Credential store operations
credential-store.operations.read-aliases=List aliases in the credential store, optionally filtered by path
credential-store.operations.read-aliases.path=The Vault path to list aliases from (e.g., "secret/myapp")
credential-store.operations.read-aliases.recursive=Whether to traverse subpaths recursively
credential-store.operations.read-aliases.recursive-depth=Maximum depth to traverse if recursive is true (0 = current path only, 1 = one level deep, etc.)
credential-store.operations.read-aliases.max-number-of-aliases=Maximum number of aliases to return (must be positive)
credential-store.operations.add-alias=Add a new credential alias to the credential store
credential-store.operations.add-alias.alias=The alias name for the credential
credential-store.operations.add-alias.secret-value=The secret value to store
credential-store.operations.remove-alias=Remove a credential alias from the credential store
credential-store.operations.remove-alias.alias=The alias name to remove